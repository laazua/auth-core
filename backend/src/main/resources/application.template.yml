# 本地开发环境配置模板
# 复制为 application.yml 并填入真实值即可本地启动
# 注意：application-local.yml 已在 .gitignore 中忽略，不会提交到代码库

server:
  port: 9998

spring:
  datasource:
    url: jdbc:mysql://192.168.165.88:3306/authcore?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: abc123456
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  health:
    db:
      enabled: true

# JWT 密钥（本地开发可使用固定值，生产环境必须从环境变量注入）
jwt:
  secret: local-dev-secret-key-at-least-32-chars-long
  expire-hours: 2

# CORS 允许的源（逗号分隔，生产环境必须配置具体域名，开发环境可用 *）
cors:
  allowed-origins: "http://localhost:3003,http://127.0.0.1:3003,http://192.168.165.89:3003"